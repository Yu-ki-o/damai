name: damai

services:
  mysql:
    image: mysql:5.7.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports: ['127.0.0.1:3306:3306']
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/cloud:/seed/business:ro
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=root mysql -h 127.0.0.1 -uroot -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  nacos:
    image: nacos/nacos-server:v2.3.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ZGFtYWktbG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1mb3ItbmFjb3M=
      NACOS_AUTH_IDENTITY_KEY: damaiLocal
      NACOS_AUTH_IDENTITY_VALUE: damaiLocalServer
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:8848:8848'
      - '127.0.0.1:9848:9848'
      - '127.0.0.1:9849:9849'
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8848/nacos/v1/console/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:6.0.8
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports: ['127.0.0.1:6379:6379']
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=root redis-cli --user root ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: zookeeper:3.8.4
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr
      JVMFLAGS: '-Xms128m -Xmx256m'
    ports: ['127.0.0.1:2181:2181']
    volumes:
      - zookeeper-data:/data
      - zookeeper-log:/datalog
    healthcheck:
      test: [CMD-SHELL, 'zkServer.sh status']
      interval: 10s
      timeout: 5s
      retries: 15

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /kafka/data
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
    ports: ['127.0.0.1:9092:9092']
    volumes: [kafka-data:/kafka]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list']
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 30s

  elasticsearch:
    image: damai/elasticsearch-ik:8.5.2
    build: ./docker/elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: '-Xms768m -Xmx768m'
    ports:
      - '127.0.0.1:9200:9200'
      - '127.0.0.1:9300:9300'
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS -u root:root "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"']
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  kibana:
    image: kibana:8.5.2
    # This image contains an empty /bin/tini; use Docker's init process instead.
    init: true
    entrypoint: [/usr/local/bin/kibana-docker]
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: root
      ELASTICSEARCH_PASSWORD: root
      I18N_LOCALE: zh-CN
      NODE_OPTIONS: --max-old-space-size=768
    ports: ['127.0.0.1:5601:5601']
    volumes: [kibana-data:/usr/share/kibana/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS -u root:root http://localhost:5601/api/status > /dev/null']
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

  logstash:
    image: logstash:8.5.2
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: '-Xms256m -Xmx512m'
    ports: ['127.0.0.1:5047:5047']
    volumes:
      - ./docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logstash-data:/usr/share/logstash/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9600/_node/pipelines/main > /dev/null']
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  mysql-data:
  nacos-data:
  nacos-logs:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  es-data:
  kibana-data:
  logstash-data:
