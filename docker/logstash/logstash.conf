input {
  tcp {
    port => 5047
    codec => json { charset => "UTF-8" }
  }
}
filter {
  if [timeMillis] {
    date { match => ["timeMillis", "UNIX_MS"] target => "@timestamp" }
  }
  mutate { remove_field => ["instant", "endOfBatch", "loggerFqcn", "threadId", "threadPriority"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "damai-logs-%{+YYYY.MM.dd}"
    user => "root"
    password => "root"
  }
}
